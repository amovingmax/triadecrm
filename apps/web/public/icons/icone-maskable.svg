<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Variante "maskable" do ícone do TRÍADE: fundo até a borda (#0f172a, o grafite-900) e o
       triângulo de três pontos (#fdfeff, o grafite-25) reduzido a 80% em torno do centro, que é
       a zona segura do adaptive icon do Android. Mesmo desenho de `MarcaTriade`. -->
  <rect width="512" height="512" fill="#0f172a"/>
  <path d="M256 174 344 331 168 331Z" fill="none" stroke="#fdfeff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fdfeff">
    <circle cx="256" cy="174" r="37"/>
    <circle cx="344" cy="331" r="37"/>
    <circle cx="168" cy="331" r="37"/>
  </g>
</svg>
