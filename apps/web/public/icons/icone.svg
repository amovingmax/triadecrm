<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ícone da PWA do TRÍADE: o mesmo desenho de `MarcaTriade` (src/components/logo.tsx) —
       três pontos ligados em triângulo, os três lados que o CRM conecta (fornecedor, produtor
       e a Komune) e o próprio nome. Quadrado escuro (#0f172a, o grafite-900 e o theme_color do
       manifest) com o traço em #fdfeff (o grafite-25).
       O quadrado é escuro nos dois temas de propósito: é a cor que encosta nele no alternador de
       apps, e a variante maskable preenche a área segura inteira, onde um quadrado quase branco
       viraria um bloco apagado sobre papel de parede claro e brigaria com a sombra do adaptive
       icon do Android.
       Gerado em PNG por `node scripts/gerar-icones.mjs`; o SVG é a fonte. -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <path d="M256 154 366 350 146 350Z" fill="none" stroke="#fdfeff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fdfeff">
    <circle cx="256" cy="154" r="46"/>
    <circle cx="366" cy="350" r="46"/>
    <circle cx="146" cy="350" r="46"/>
  </g>
</svg>
