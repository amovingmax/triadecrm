# O app de celular é um projeto pnpm à parte, com lockfile próprio (apps/app/pnpm-lock.yaml).
#
# Por quê: o app usa o React do React Native (19.3), e o site, o do Next (19.2). No mesmo
# workspace, o pnpm punha o React e os tipos do app na reserva interna
# (node_modules/.pnpm/node_modules), que pacotes do site sem dependência declarada
# consultam: o typecheck do site quebrou em 29/10/2026. Separado, o lockfile da raiz e
# tudo que o site resolve ficam exatamente como na main.
#
# Instalar: `pnpm -C apps/app install` (a raiz não instala o app).
packages:
  - '.'

# As mesmas travas do .npmrc da raiz, que não vale aqui.
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: false

# Como na raiz: o pnpm 11 bloqueia scripts de pós-instalação; só o esbuild (do tsx)
# roda o dele, que valida o binário nativo.
allowBuilds:
  esbuild: true

# Uma versão só de cada módulo nativo (05/11/2026). A montagem do iPhone leva um módulo
# nativo uma vez só, e o `expo doctor` da nuvem do Expo achou dois: o expo puxava o
# expo-file-system 58.0.13 e o expo-asset 58.0.19 (que pede o expo-constants 58.0.14),
# versões com menos de duas semanas. Aqui ficam as versões com duas semanas que todos aceitam.
overrides:
  expo-asset: 58.0.18
  expo-constants: 58.0.13
  expo-file-system: 58.0.10
