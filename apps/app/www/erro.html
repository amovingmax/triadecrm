<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Tríade · Sem internet</title>
    <!--
      A tela que a casca mostra quando o site não abre (server.errorPath em src/ambiente.ts).
      É a "Sem conexão" do protótipo aprovado. Mora no app porque, sem internet, é a única
      que dá para desenhar. Quando a conexão volta, o app abre o Tríade de novo sozinho.
      `inicio.js` é gerado por scripts/preparar-www.ts com o endereço do ambiente.
    -->
    <script src="inicio.js"></script>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('fontes/PlusJakartaSans-latin.woff2') format('woff2');
        font-weight: 300 600;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050505;
        color: #f4f4f3;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100%;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px
          calc(env(safe-area-inset-bottom, 0px) + 24px);
        display: flex;
        flex-direction: column;
      }
      .centro {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        text-align: center;
      }
      .icone {
        width: 72px;
        height: 72px;
        border-radius: 9999px;
        background: #1c1c1c;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      p {
        margin: 8px 0 0;
        max-width: 300px;
        font-size: 15px;
        line-height: 1.5;
        color: #a3a3a2;
      }
      button {
        height: 52px;
        border: 0;
        border-radius: 9999px;
        background: #ffffff;
        color: #111110;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="centro">
        <span class="icone" aria-hidden="true">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h.01"></path>
            <path d="M8.5 16.429a5 5 0 0 1 7 0"></path>
            <path d="M5 12.859a10 10 0 0 1 5.17-2.69"></path>
            <path d="M19 12.859a10 10 0 0 0-2.007-1.523"></path>
            <path d="M2 8.82a15 15 0 0 1 4.177-2.643"></path>
            <path d="M22 8.82a15 15 0 0 0-11.288-3.764"></path>
            <path d="m2 2 20 20"></path>
          </svg>
        </span>
        <div>
          <h1>Sem internet</h1>
          <p>
            Nada foi gravado enquanto a conexão caiu. Quando ela voltar, o Tríade abre de novo
            sozinho.
          </p>
        </div>
      </div>
      <button type="button" id="tentar">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
        Tentar de novo
      </button>
    </main>
    <script>
      function abrirOTriade() {
        if (window.TRIADE_INICIO) window.location.replace(window.TRIADE_INICIO);
      }
      document.getElementById('tentar').addEventListener('click', abrirOTriade);
      window.addEventListener('online', abrirOTriade);
    </script>
  </body>
</html>
