# Docker Compose da máquina dedicada do KOMUNE CRM (ADR-04: recepção em nuvem, processamento local).
# Sobe os três workers (mesma imagem, comandos diferentes) e o Metabase OSS.
#
# Uso, a partir desta pasta (infra/local):
#   docker compose build                      # constrói a imagem dos workers a partir da raiz do repo
#   docker compose up -d                      # sobe só o Metabase (os workers ficam no profile "workers")
#   docker compose --profile workers up -d    # sobe Metabase + workers
#   docker compose logs -f worker-wa
#   docker compose --profile workers down     # derruba tudo (os dados do Metabase ficam em ./data)
#
# Segredos: lidos de ../../.env (raiz do repo, gitignored; modelo em ../../.env.example).
# Overrides só desta máquina, se precisar: ./.env (opcional, também gitignored).
# Ainda por vir (PRD §9.2): osrm/vroom (rotas, D7) e faster-whisper (transcrição de áudio, v2).

name: komune-crm

x-worker: &worker
  build:
    context: ../..
    dockerfile: apps/workers/Dockerfile
  image: komune-crm/workers:local
  env_file:
    - path: ../../.env
      required: true
    - path: ./.env
      required: false
  environment:
    NODE_ENV: production
    TZ: America/Fortaleza
  # Até D4/D5/D6 os workers só registram um heartbeat e encerram; por isso ficam atrás do profile "workers".
  profiles: ['workers']
  restart: unless-stopped
  # Logs em JSON no stdout, com rotação para não encher o disco da máquina.
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'
  # Permite ao contêiner alcançar serviços do host (ex.: Supabase local em 127.0.0.1:54321/54322) também em Linux.
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  # Radar: scrapers, planilhas e base CNPJ → esteira de ingestão (D4).
  worker-ingest:
    <<: *worker
    command: ['ingest']

  # WhatsApp: envios pela Cloud API da Meta, cadências, áudios (D5).
  worker-wa:
    <<: *worker
    command: ['wa']

  # IA: classificação, rascunhos, resumos e Assistente (D6).
  worker-ai:
    <<: *worker
    command: ['ai']

  # Metabase OSS (AGPL, usuários ilimitados) para os painéis do PRD §7.8 (RF-REL) e o relatório de segunda.
  # Conecte-o ao Postgres com uma role SOMENTE LEITURA (R05): em dev, host.docker.internal:54322 (postgres/postgres);
  # em produção, o pooler do Supabase (Supavisor, modo sessão) com a role de leitura criada nas migrações.
  metabase:
    image: metabase/metabase:v0.63.x
    ports:
      - '3001:3000'
    environment:
      # Banco interno do Metabase (H2) persistido no volume abaixo; migrar para Postgres se virar uso intenso.
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Fortaleza
      MB_SITE_LOCALE: pt_BR
    volumes:
      - ./data/metabase:/metabase-data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '--fail', '-I', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
